# The `migrate` service (postgres healthy -> migrate -> api) is added in
# Phase 2, together with the first migrations.
services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 2s
      timeout: 3s
      retries: 15

    networks:
      - app-network

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    container_name: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://blog:blog@postgres:5432/blog?sslmode=disable
      LOG_LEVEL: info
      TRUSTED_PROXIES: ""
      IP_HASH_SECRET: dev-only-change-me
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  pgdata:


networks:
  app-network:
    name: app-network
    driver: bridge
