# Startup order: postgres (healthy) -> migrate (goose up) -> api.
services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - volume_pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 2s
      timeout: 3s
      retries: 15

    networks:
      - app-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://blog:blog@postgres:5432/blog?sslmode=disable
    command: ["up"]
    restart: "no"
    networks:
      - app-network

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    container_name: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://blog:blog@postgres:5432/blog?sslmode=disable
      LOG_LEVEL: info
      TRUSTED_PROXIES: ""
      IP_HASH_SECRET: dev-only-change-me
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  volume_pgdata:
    name: pgdata

networks:
  app-network:
    name: app-network
    driver: bridge
